version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lawgic_ml_backend
    restart: always
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./src/.env
    environment:
      - PORT=5000
    volumes:
      - ./uploads:/app/uploads
